# Vertex AI Custom Training Job Configuration for Gemma 4 LoRA
workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-8
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.1-13.py310:latest
      args:
        - "--base_model=google/gemma-4-2b-it"
        - "--lora_rank=8"
        - "--lora_alpha=16"
        - "--target_modules=q_proj,v_proj"
        - "--epochs=3"
        - "--batch_size=4"
        - "--learning_rate=2e-4"
        - "--dataset_path=gs://voice-memory-data/weekly_export.jsonl"
        - "--output_dir=gs://voice-memory-models/weekly_lora_delta/"
